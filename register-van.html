<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanIt | Register a Van</title>

    <!-- Bootstrap (layout + dropdown/modal), Bootstrap Icons, Inter font, then our own style.css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <div class="app-shell">
        <!-- Header -->
        <header class="header">
            <a href="admin.html" class="back-btn" aria-label="Back"><i class="bi bi-chevron-left"></i></a>
            <div>
                <p class="header-label">Admin</p>
                <h1 class="header-title">Register a Van</h1>
            </div>

            <!-- Menu (same on every admin page). Button picture: images/nav-menu-btn.png -->
            <div class="dropdown menu-dropdown">
                <button class="menu-btn" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false" aria-label="Open menu">
                    <img src="images/nav-menu-btn.png" alt="" class="menu-icon">
                </button>

                <ul class="dropdown-menu dropdown-menu-end menu-panel">
                    <li><a class="menu-item" href="create-account.html"><i class="bi bi-person-circle"></i>Create Account</a></li>
                    <li><a class="menu-item" href="register-van.html" aria-current="page"><i class="bi bi-truck-front-fill"></i>Register a Van</a></li>
                    <li><a class="menu-item" href="registered-vans.html"><i class="bi bi-card-list"></i>View Registered Vans</a></li>
                    <li><a class="menu-item" href="live-map.html"><i class="bi bi-geo-alt-fill"></i>Open Live Van Map</a></li>
                    <li><a class="menu-item" href="export-history.html"><i class="bi bi-box-arrow-up-right"></i>Export IN/OUT History</a></li>
                </ul>
            </div>
        </header>

        <!-- Main content -->
        <main class="main">
            <div class="content">

                <!-- Form card -->
                <div class="card-vanit">

                    <div>
                        <label for="plate-number" class="field-label">Plate number</label>
                        <input type="text" id="plate-number" class="form-control input-vanit" placeholder="ABC 1234">
                    </div>

                    <div>
                        <label for="dedicated-account" class="field-label">Dedicated driver / operator</label>
                        <!-- Placeholder names. Later this list comes from the saved accounts. -->
                        <select id="dedicated-account" class="form-select input-vanit">
                            <option value="" selected disabled>Select an account</option>
                            <option>Jungkick S. (Driver)</option>
                            <option>Banana T. (Operator)</option>
                            <option>Applelina N. (Driver)</option>
                        </select>
                    </div>

                </div>

                <p class="text-muted-custom small mb-0 ms-1">The plate number is used in the logbook.</p>

                <!-- Frontend only: shows the toast, then goes back to the dashboard -->
                <div class="page-action">
                    <a href="admin.html" class="btn btn-vanit-primary w-100" data-toast="Successfully created a new van.">Save van</a>
                </div>

            </div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="toast.js"></script>
</body>
</html>
