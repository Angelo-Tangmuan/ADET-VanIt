<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanIt | Create an Account</title>

    <!-- Bootstrap (layout + dropdown/modal), Bootstrap Icons, Inter font, then our own style.css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <div class="app-shell">
        <!-- Header -->
        <header class="header">
            <a href="admin.html" class="back-btn" aria-label="Back"><i class="bi bi-chevron-left"></i></a>
            <div>
                <p class="header-label">Admin</p>
                <h1 class="header-title">Create an Account</h1>
            </div>

            <!-- Menu (same on every admin page). Button picture: images/nav-menu-btn.png -->
            <div class="dropdown menu-dropdown">
                <button class="menu-btn" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false" aria-label="Open menu">
                    <img src="images/nav-menu-btn.png" alt="" class="menu-icon">
                </button>

                <ul class="dropdown-menu dropdown-menu-end menu-panel">
                    <li><a class="menu-item" href="create-account.html" aria-current="page"><i class="bi bi-person-circle"></i>Create Account</a></li>
                    <li><a class="menu-item" href="register-van.html"><i class="bi bi-truck-front-fill"></i>Register a Van</a></li>
                    <li><a class="menu-item" href="registered-vans.html"><i class="bi bi-card-list"></i>View Registered Vans</a></li>
                    <li><a class="menu-item" href="live-map.html"><i class="bi bi-geo-alt-fill"></i>Open Live Van Map</a></li>
                    <li><a class="menu-item" href="export-history.html"><i class="bi bi-box-arrow-up-right"></i>Export IN/OUT History</a></li>
                </ul>
            </div>
        </header>

        <!-- Main content -->
        <main class="main">
            <div class="content">

                <!-- Form card -->
                <div class="card-vanit">

                    <div>
                        <label for="full-name" class="field-label">Full name</label>
                        <input type="text" id="full-name" class="form-control input-vanit" placeholder="Juan Dela Cruz" autocomplete="name">
                    </div>

                    <div>
                        <label for="username" class="field-label">Username</label>
                        <input type="text" id="username" class="form-control input-vanit" placeholder="juan.dc" autocomplete="username">
                    </div>

                    <div>
                        <label for="password" class="field-label">Temporary password</label>
                        <input type="password" id="password" class="form-control input-vanit" placeholder="••••••••" autocomplete="new-password">
                    </div>

                    <div>
                        <span class="field-label">Role</span>
                        <div class="role-toggle">
                            <input type="radio" class="btn-check" name="role" id="role-driver" value="driver" checked>
                            <label class="role-option" for="role-driver">Driver</label>

                            <input type="radio" class="btn-check" name="role" id="role-operator" value="operator">
                            <label class="role-option" for="role-operator">Operator</label>
                        </div>
                    </div>

                </div>

                <!-- Frontend only: shows the toast, then goes back to the dashboard -->
                <div class="page-action">
                    <a href="admin.html" class="btn btn-vanit-primary w-100" data-toast="Successfully created an account.">Save account</a>
                </div>

            </div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="toast.js"></script>
</body>
</html>
