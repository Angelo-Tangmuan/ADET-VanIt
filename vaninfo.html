<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanIt | Van Information Updates</title>
    <meta name="theme-color" content="#0b2545">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <div class="app-shell">
        <header class="header">
            <div>
                <p class="header-label">Van ABC 1234</p>
                <h1 class="header-title">Van Information Updates</h1>
            </div>
        </header>

        <main class="main">
            <div class="content">

                <!-- Reuses the GPS banner (green dot + text) for the trip status -->
                <div class="gps-banner gps-on">
                    <span>Status: At terminal</span>
                </div>

                <div class="card-vanit">
                    <div class="field-label mb-0">Route / Destination</div>
                    <div class="d-flex flex-column gap-2">
                        <div class="data-row"><span>Destination</span><span class="data-value">Driver-selected</span></div>
                        <div class="data-row"><span>ETA</span><span class="data-value">Updating</span></div>
                        <div class="data-row"><span>Terminal IN Time</span><span class="data-value">Recorded</span></div>
                        <div class="data-row"><span>OUT Time</span><span class="data-value">Recorded</span></div>
                    </div>
                </div>

                <div class="card-vanit">
                    <div class="field-label mb-0">Enable Location Service</div>
                    <div class="status-btn gps-on-btn text-center">Status: Enabled</div>
                </div>

                <div class="page-action">
                    <a href="driver-map.html" class="btn btn-vanit-primary">View Live Van Map</a>
                </div>

            </div>
        </main>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
