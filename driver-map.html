<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VanIt | My Live Van Map</title>
    <meta name="theme-color" content="#0b2545">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <div class="app-shell">
        <header class="header">
            <a href="vaninfo.html" class="back-btn" aria-label="Back"><i class="bi bi-chevron-left"></i></a>
            <div>
                <p class="header-label">Van ABC 1234</p>
                <h1 class="header-title">My Live Van Map</h1>
            </div>
        </header>

        <main class="main">
            <div class="content">

                <!-- CSS-only map placeholder (roads are drawn by .map-box).
                     The dot sits on the vertical road (left 38% + half the road width). -->
                <div class="map-box" role="img" aria-label="Map showing Van ABC 1234">
                    <span class="map-dot map-dot-in" title="Van ABC 1234"
                          style="left: calc(38% + 0.375rem); top: 70%; transform: translate(-50%, -50%);"></span>
                </div>

                <div class="page-action">
                    <a href="index.html" class="btn btn-vanit-out">End Trip</a>
                </div>

            </div>
        </main>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
